spring:
  application:
    name: case-import-server
  cloud:
    stream:
      bindings:
        publishCaseImported-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}caseimport.imported
      output-bindings: publishCaseImported-out-0

# mapping of target directories based on the origin of the case
case-import-server:
  target-directories:
    origin1: case_import_directory_1
    default: Automatic_cases_import

server:
  max-http-header-size: 64000
